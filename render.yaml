services:
  - type: web
    name: attendio-shield
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CAMPUS_NAME
        value: Dumka Engineering College
      - key: CAMPUS_LAT
        value: "24.2676"
      - key: CAMPUS_LNG
        value: "87.2486"
      - key: CAMPUS_RADIUS_METERS
        value: "500"
      - key: ATTENDANCE_LATE_AFTER_MINUTES
        value: "15"
      - key: SESSION_SECRET
        generateValue: true
